name: CI

# Changes to main are checked locally by .githooks/pre-push; pull requests come
# from Dependabot.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  analyze-and-test:
    name: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: changes
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          check=false
          build=false
          if grep -qE '^(lib|test|android|assets)/|^pubspec\.(yaml|lock)$|^analysis_options\.yaml$|^\.github/workflows/' <<< "$files"; then
            check=true
          fi
          if grep -qE '^(android|assets)/|^pubspec\.(yaml|lock)$|^\.github/workflows/ci\.yml$' <<< "$files"; then
            build=true
          fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.changes.outputs.check == 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.check == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        if: steps.changes.outputs.check == 'true'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        if: steps.changes.outputs.check == 'true'
        run: flutter analyze

      - name: Test
        if: steps.changes.outputs.check == 'true'
        run: flutter test

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: flutter build apk --debug
