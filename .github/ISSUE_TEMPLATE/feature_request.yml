name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AniHub makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I read the [project scope](https://github.com/AlvaroMunozS/AniHub/blob/main/CONTRIBUTING.md#scope) and this request fits it.
          required: true
