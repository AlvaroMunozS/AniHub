name: anihub
description: "A minimal anime tracker for Android."
publish_to: 'none'
version: 1.1.0+13

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  sqflite: ^2.4.4
  path: ^1.9.1
  file_picker: ^13.1.0
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.5
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # In-memory sqflite for repository tests, without the native plugin.
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  # Inter variable font (SIL OFL 1.1, see assets/fonts/OFL.txt). Weights are
  # selected through the `wght` axis with `fontVariations`.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  assets:
    - assets/images/app_icon.png
    - assets/fonts/OFL.txt
